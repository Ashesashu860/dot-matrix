# Firebase App Hosting config for the Next.js app.
# Create one backend per Firebase project with root directory `apps/web` (monorepo), and set
# each backend's Environment name (App Hosting → backend → Settings) to `staging` or
# `production`. App Hosting merges this file with the matching apphosting.<env>.yaml, which
# holds that project's web config.
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATORS
    value: "false"
    availability: [BUILD, RUNTIME]
